name: Mobile Build (iOS + Android)
# -----------------------------------------------------------------------------
# Builds the Capacitor-wrapped Hotel PMS app for both platforms on every push
# to `main` and on tag pushes. Designed for scale:
#   - iOS uses macOS runner → produces signed .ipa
#   - Android uses Ubuntu runner → produces signed .aab
#   - Artifacts uploaded for download
#   - Optional: auto-upload to TestFlight / Play Console internal track
#
# Required GitHub Secrets:
#   APPLE_CERTIFICATE_BASE64       distribution certificate (.p12 → base64)
#   APPLE_CERTIFICATE_PASSWORD     password for .p12
#   APPLE_PROVISIONING_PROFILE     provisioning profile (.mobileprovision → base64)
#   APPLE_TEAM_ID                  10-char team ID
#   APP_STORE_CONNECT_API_KEY      .p8 private key (base64)
#   APP_STORE_CONNECT_KEY_ID       App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID    App Store Connect issuer ID
#   ANDROID_KEYSTORE_BASE64        upload keystore (.jks → base64)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON   for Play Console auto-upload
#   REACT_APP_BACKEND_URL          production backend URL
# -----------------------------------------------------------------------------

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build the React web bundle once (shared between platforms)
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Build web bundle
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          GENERATE_SOURCEMAP: "false"
          CI: "false"
        run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend/build
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. iOS build — produces signed .ipa, optional TestFlight upload
  # ---------------------------------------------------------------------------
  ios:
    needs: web
    runs-on: macos-14
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: frontend/build
      - name: Install JS deps
        run: yarn install --frozen-lockfile
      - name: Capacitor add iOS (idempotent)
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Install Pods
        working-directory: frontend/ios/App
        run: pod install --repo-update
      - name: Decode signing assets
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "::warning::No signing assets — skipping archive (CI smoke build only)."
            exit 0
          fi
          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          echo "$PROFILE_B64" | base64 --decode > /tmp/profile.mobileprovision
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Archive + Export .ipa
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: frontend/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ../../scripts/ExportOptions.plist
      - uses: actions/upload-artifact@v4
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        with:
          name: ios-ipa
          path: frontend/ios/App/build/ipa/*.ipa
      - name: Upload to TestFlight
        if: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$KEY_B64" | base64 --decode > ~/.private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -f frontend/ios/App/build/ipa/*.ipa \
            --type ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

  # ---------------------------------------------------------------------------
  # 3. Android build — produces signed .aab, optional Play Console upload
  # ---------------------------------------------------------------------------
  android:
    needs: web
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: frontend/build
      - name: Install JS deps
        run: yarn install --frozen-lockfile
      - name: Capacitor add Android (idempotent)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::No keystore — building unsigned debug bundle."
            exit 0
          fi
          mkdir -p android/app
          echo "$KS_B64" | base64 --decode > android/app/upload.jks
      - name: Build .aab (release)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: frontend/android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/upload.jks \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
      - name: Build .aab (unsigned smoke test)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: frontend/android
        run: ./gradlew bundleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: |
            frontend/android/app/build/outputs/bundle/release/*.aab
            frontend/android/app/build/outputs/bundle/debug/*.aab
      - name: Upload to Google Play (internal track)
        if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' && startsWith(github.ref, 'refs/tags/v') }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hotelpms.app
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
