<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Guest Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: transparent; }
  #app { display: flex; flex-direction: column; height: 100vh; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.12); }
  .header { background: linear-gradient(135deg,#6d28d9 0%,#4f46e5 50%,#0e7490 100%); color: #fff; padding: 14px 18px; }
  .header h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.02em; }
  .header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; background: #fafaf9; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(4px);} to { opacity:1; transform: translateY(0);} }
  .msg.bot { background: #fff; color: #292524; border: 1px solid #e7e5e4; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: #6d28d9; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.system { background: #fef3c7; color: #92400e; align-self: center; font-size: 11px; padding: 6px 10px; border-radius: 8px; }
  .badge { font-size: 9px; padding: 2px 6px; border-radius: 10px; background: #f5f5f4; color: #57534e; margin-left: 6px; font-weight: 600; }
  .input-row { display: flex; padding: 10px 12px; border-top: 1px solid #e7e5e4; background: #fff; gap: 8px; }
  .input-row input { flex: 1; padding: 10px 12px; border: 1px solid #d6d3d1; border-radius: 10px; font-size: 13px; outline: none; transition: border-color 0.15s; }
  .input-row input:focus { border-color: #6d28d9; }
  .input-row button { background: linear-gradient(135deg,#6d28d9,#4f46e5); color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
  .input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing { display: inline-flex; gap: 3px; padding: 8px 12px; }
  .typing span { width: 6px; height: 6px; background: #a8a29e; border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity:0.5; } 30% { transform: translateY(-4px); opacity:1; } }
  .footer { font-size: 10px; color: #a8a29e; text-align: center; padding: 6px; background: #fafaf9; border-top: 1px solid #f5f5f4; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1 id="header-title">Guest Chat</h1>
    <p id="header-sub">Yardımcı olalım…</p>
  </div>
  <div class="messages" id="msgs"></div>
  <div class="input-row">
    <input id="input" placeholder="Mesajınızı yazın…" maxlength="500" />
    <button id="send" type="button">Gönder</button>
  </div>
  <div class="footer">⚡ AI destekli · Cevapsız konular için temsilciye iletilir</div>
</div>
<script>
(function(){
  // PARAMS: ?property_id=xxx&api=https://api...   (api is optional, defaults to current origin)
  const params = new URLSearchParams(window.location.search);
  const PROPERTY_ID = params.get("property_id") || "";
  const API_BASE = (params.get("api") || window.location.origin).replace(/\/$/, "");

  // Persistent session id
  let SESSION_ID = localStorage.getItem("chat_widget_session");
  if (!SESSION_ID) {
    SESSION_ID = "sess-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("chat_widget_session", SESSION_ID);
  }

  let IN_HANDOFF = false;
  let HANDOFF_SINCE = null;
  let HANDOFF_POLL_TIMER = null;

  const msgsEl = document.getElementById("msgs");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const titleEl = document.getElementById("header-title");
  const subEl = document.getElementById("header-sub");

  function addMsg(text, cls, badge) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    if (badge) {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = badge;
      div.appendChild(b);
    }
    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return div;
  }

  function setHandoff(on) {
    IN_HANDOFF = on;
    if (on) {
      subEl.textContent = "Canlı destek hattı · temsilciye bağlı";
      startHandoffPoll();
    } else {
      subEl.textContent = "Yardımcı olalım…";
      stopHandoffPoll();
    }
  }

  function startHandoffPoll() {
    if (HANDOFF_POLL_TIMER) return;
    if (!HANDOFF_SINCE) HANDOFF_SINCE = new Date().toISOString();
    HANDOFF_POLL_TIMER = setInterval(async function() {
      try {
        const q = new URLSearchParams({ session_id: SESSION_ID, since: HANDOFF_SINCE || "" });
        const r = await fetch(`${API_BASE}/api/public/chatbot/${PROPERTY_ID}/handoff-messages?${q.toString()}`);
        if (!r.ok) return;
        const data = await r.json();
        (data.messages || []).forEach(function(m) {
          const cls = m.sender === "staff" ? "bot" : "system";
          const label = m.sender === "staff" ? (m.sender_name || "Temsilci") : null;
          addMsg(m.text, cls, label);
          HANDOFF_SINCE = m.created_at;
        });
        if (data.session_status === "closed") {
          setHandoff(false);
          addMsg("Görüşme kapatıldı. Yeni soru için mesaj yazın.", "system");
        }
      } catch (e) { /* swallow polling errors */ }
    }, 5000);
  }

  function stopHandoffPoll() {
    if (HANDOFF_POLL_TIMER) { clearInterval(HANDOFF_POLL_TIMER); HANDOFF_POLL_TIMER = null; }
  }

  async function init() {
    if (!PROPERTY_ID) {
      addMsg("Konfigürasyon hatası: property_id eksik.", "system");
      sendBtn.disabled = true;
      return;
    }
    try {
      const r = await fetch(`${API_BASE}/api/public/chatbot/${PROPERTY_ID}/info`);
      if (!r.ok) {
        if (r.status === 403) {
          addMsg("Bu otelde chatbot şu anda aktif değil.", "system");
        } else if (r.status === 404) {
          addMsg("Otel bulunamadı.", "system");
        } else {
          addMsg("Bağlantı hatası. Lütfen daha sonra tekrar deneyin.", "system");
        }
        sendBtn.disabled = true;
        return;
      }
      const info = await r.json();
      titleEl.textContent = info.property_name || "Guest Chat";
      subEl.textContent = "Yardımcı olalım…";
      addMsg(info.greeting || "Merhaba! Size nasıl yardımcı olabilirim?", "bot");
    } catch (e) {
      addMsg("Bağlantı hatası: " + e.message, "system");
      sendBtn.disabled = true;
    }
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    addMsg(text, "user");
    sendBtn.disabled = true;
    const typing = addTyping();
    try {
      const r = await fetch(`${API_BASE}/api/public/chatbot/${PROPERTY_ID}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, session_id: SESSION_ID }),
      });
      typing.remove();
      if (r.status === 429) {
        addMsg("Çok hızlı yazıyorsun — birkaç dakika sonra tekrar dene.", "system");
        return;
      }
      if (!r.ok) {
        addMsg("Yanıt alınamadı (HTTP " + r.status + ")", "system");
        return;
      }
      const data = await r.json();
      const reply = data.reply_text || "Mesajınızı aldık.";
      addMsg(reply, "bot", data.match_type && data.match_type !== "none" ? data.match_type : null);
      if (data.in_handoff && !IN_HANDOFF) {
        setHandoff(true);
        addMsg("Bir temsilci kısa süre içinde yanıtlayacak.", "system");
      }
    } catch (e) {
      typing.remove();
      addMsg("Bağlantı kesildi. Tekrar dener misin?", "system");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", function(e) { if (e.key === "Enter") send(); });

  init();
})();
</script>
</body>
</html>
